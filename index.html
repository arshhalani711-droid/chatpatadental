<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatpata Dental Studio</title>
    <script>
      // Gracefully prevent and handle benign [vite] failed to connect to websocket errors
      (function() {
        if (typeof window === 'undefined') return;
        const OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        window.WebSocket = function(url, protocols) {
          const isViteWS = (
            (typeof protocols === 'string' && protocols === 'vite-hmr') ||
            (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
            (typeof url === 'string' && (
              url.includes('/vite') || 
              url.includes(':3000') || 
              url.includes('127.0.0.1') || 
              url.includes('localhost')
            ))
          );

          if (isViteWS) {
            const listeners = {};
            const fakeSocket = {
              url: url,
              readyState: 0, // CONNECTING
              bufferedAmount: 0,
              extensions: "",
              protocol: "vite-hmr",
              binaryType: "blob",
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              send: function() {},
              close: function() {
                fakeSocket.readyState = 3; // CLOSED
                if (fakeSocket.onclose) fakeSocket.onclose();
                if (listeners['close']) {
                  listeners['close'].forEach(cb => cb());
                }
              },
              addEventListener: function(event, callback) {
                if (!listeners[event]) listeners[event] = [];
                listeners[event].push(callback);
              },
              removeEventListener: function(event, callback) {
                if (listeners[event]) {
                  listeners[event] = listeners[event].filter(cb => cb !== callback);
                }
              },
              dispatchEvent: function() { return true; }
            };

            // Transition to virtual OPEN state and invoke callback listeners
            setTimeout(() => {
              fakeSocket.readyState = 1; // OPEN
              if (fakeSocket.onopen) fakeSocket.onopen();
              if (listeners['open']) {
                listeners['open'].forEach(cb => cb());
              }
            }, 100);

            return fakeSocket;
          }

          return new OriginalWebSocket(url, protocols);
        };

        // Maintain prototype chain and static properties
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        Object.assign(window.WebSocket, OriginalWebSocket);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatpata Dental Studio</title>
    <script>
      // Gracefully prevent and handle benign [vite] failed to connect to websocket errors
      (function() {
        if (typeof window === 'undefined') return;
        const OriginalWebSocket = window.WebSocket;
        if (!OriginalWebSocket) return;

        window.WebSocket = function(url, protocols) {
          const isViteWS = typeof url === 'string' && (
            url.includes('/vite') || 
            url.includes(':3000') || 
            url.includes('127.0.0.1') || 
            url.includes('localhost')
          );

          if (isViteWS) {
            // Create a fake WebSocket-like object to prevent browser errors & console noise
            const fakeSocket = {
              url: url,
              readyState: 3, // CLOSED
              bufferedAmount: 0,
              extensions: "",
              protocol: "",
              binaryType: "blob",
              onopen: null,
              onmessage: null,
              onerror: null,
              onclose: null,
              send: function() {},
              close: function() {},
              addEventListener: function(event, callback) {
                // If Vite listens for 'close' or 'error', we don't trigger them to avoid console alerts or retries
                // Or if we want to simulate a quiet close:
                if (event === 'close') {
                  // Do not trigger immediately to avoid spinning infinite reconnection loops in Vite
                }
              },
              removeEventListener: function() {},
              dispatchEvent: function() { return true; }
            };
            return fakeSocket;
          }

          // Fallback to original WebSocket for any actual user real-time connections
          return new OriginalWebSocket(url, protocols);
        };

        // Maintain prototype chain and static functions
        window.WebSocket.prototype = OriginalWebSocket.prototype;
        Object.assign(window.WebSocket, OriginalWebSocket);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
